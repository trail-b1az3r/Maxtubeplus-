name: Create MaxTubePlus, MaxTube or YouTube Plus app

on:
  workflow_dispatch:
    inputs:
      enable_youpip:
        description: "Integrate YouPiP"
        type: boolean
        required: true
        default: false

      enable_ytuhd:
        description: "Integrate YTUHD"
        type: boolean
        required: true
        default: false

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: false

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: false

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: false

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: false

      enable_ytweaks:
        description: "Integrate YTweaks (MaxTube)"
        type: boolean
        required: true
        default: false
        
      enable_gonerino:
        description: "Integrate Gonerino (MaxTube)"
        type: boolean
        required: true
        default: false

      enable_youspeed:
       description: "Integrate YouSpeed (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ytlcm:
       description: "Integrate YTLowContrastMode (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_VolumeBoostYT:
       description: "Integrate VolumeBoostYT (not compatible with iOS 15; MaxTube)"
       type: boolean
       required: true
       default: false

      enable_YouGetCaption:
       description: "Integrate YouGetCaption (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ytpf:
       description: "Integrate YTPlaybackFix, my tweak (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ytpfBETA:
       description: "Integrate my YTPlaybackFix but latest beta version, at your own risk... (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ycq:
       description: "Integrate YouChooseQuality (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ys:
       description: "Integrate YouShare (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_youloop:
       description: "Integrate YouLoop (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_youmute:
       description: "Integrate YouMute (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ytlocalqueue:
        description: "NEW! Integrate YTLocalQueue (MaxTube)"
        type: boolean
        required: true
        default: false

      enable_maxtubeplus:
        description: "Integrate MaxTubePlus (background downloads, DeArrow, 120Hz, creator suppression, advanced search, floating-menu dock fix)"
        type: boolean
        required: true
        default: true

      allow_other_version:
        description: "Allow a YouTube version other than 21.42.4 (MaxTubePlus modules self-check at runtime)"
        type: boolean
        required: true
        default: false

      ipa_url:
        description: "URL to the decrypted YouTube 21.42.4 IPA (one you are authorised to use)"
        default: ""
        required: true
        type: string

      tweak_version:
        description: "The version of the tweak to use. Versions that you can use are from 5.1 to 6.0b2 (no 5.2)"
        default: "6.0b2"
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}
      enable_ytweaks: ${{ inputs.enable_ytweaks }}
      enable_gonerino: ${{ inputs.enable_gonerino }}
      enable_youspeed: ${{ inputs.enable_youspeed }}
      enable_ytlcm: ${{ inputs.enable_ytlcm }}
      enable_VolumeBoostYT: ${{ inputs.enable_VolumeBoostYT }}
      enable_YouGetCaption: ${{ inputs.enable_YouGetCaption }}
      enable_ytpf: ${{ inputs.enable_ytpf }}
      enable_ytpfBETA: ${{ inputs.enable_ytpfBETA }}
      enable_ycq: ${{ inputs.enable_ycq }}
      enable_ys: ${{ inputs.enable_ys }}
      enable_youloop: ${{ inputs.enable_youloop }}
      enable_youmute: ${{ inputs.enable_youmute }}
      enable_ytlocalqueue: ${{ inputs.enable_ytlocalqueue }}
      enable_maxtubeplus: ${{ inputs.enable_maxtubeplus }}
      tweak_version: ${{ inputs.tweak_version }}

  hide-inputs:
    name: Mask IPA URL
    runs-on: ubuntu-latest
    steps:
      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,enable_demc,enable_ryd,enable_ytabc,enable_youpip,enable_yq,enable_ytuhd,enable_ytweaks,enable_gonerino,enable_youspeed,enable_ytlcm,enable_VolumeBoostYT,enable_YouGetCaption,enable_ytpf,enable_ytpfBETA,enable_ycq,enable_ys,enable_youloop,enable_youmute,enable_ytlocalqueue,enable_maxtubeplus,allow_other_version,tweak_version

  package:
    needs: [build-tweaks, hide-inputs]
    uses: ./.github/workflows/_package_ipa.yml
    permissions:
      contents: write
    with:
      tweak_version: ${{ inputs.tweak_version }}
      display_name: ${{ inputs.display_name }}
      bundle_id: ${{ inputs.bundle_id }}
      enable_maxtubeplus: ${{ inputs.enable_maxtubeplus }}
      maxtubeplus_extras: ${{ inputs.enable_ytweaks || inputs.enable_gonerino || inputs.enable_youspeed || inputs.enable_ytlcm || inputs.enable_VolumeBoostYT || inputs.enable_YouGetCaption || inputs.enable_ytpf || inputs.enable_ytpfBETA || inputs.enable_ycq || inputs.enable_ys || inputs.enable_youloop || inputs.enable_youmute || inputs.enable_ytlocalqueue }}
      allow_other_version: ${{ inputs.allow_other_version }}
    secrets:
      IPA_URL: ${{ inputs.ipa_url }}
